# repokeeper configuration: https://github.com/vannt-dev/repokeeper
schema: 1
standard: 1.3.1
platform: github
stacks:
  - dotnet
modules:
  editorconfig: true
  commits: true
  hooks: true
  ci: true
  release: true
  deps: true
  gitignore: true
  health:
    license: MIT
    copyright: 2026 Van Nguyen
    contact: https://github.com/vannt-dev
    codeowners:
      - "@vannt-dev"
owned: []
stack_options: {}
github:
  description: Demo .NET solution for piloting repokeeper
  topics: [ repokeeper, dotnet, demo ]
  merge:
    squash: true
    merge_commit: false
    rebase: false
    delete_branch_on_merge: true
  security:
    dependabot_alerts: true
    dependabot_security_updates: true
  protect:
    required_checks: [ "commits / commitlint", "dotnet / dotnet (ubuntu-latest)" ]
